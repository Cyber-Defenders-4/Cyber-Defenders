name: Burndown

on:
  schedule:
    - cron: "0 21 * * *"   # taeglich 21:00 UTC (23:00 Sommerzeit, 22:00 Winterzeit)
  workflow_dispatch:        # manuell startbar im Tab Actions

permissions:
  contents: write
  pull-requests: write

jobs:
  burndown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install matplotlib

      - name: Burndown aus Board-Daten erzeugen
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          mkdir -p docs/burndown
          python burndown.py --owner Cyber-Defenders-4 --project 2 --sprint current --out docs/burndown/burndown.png

      # main ist geschützt (Änderungen nur per Pull Request). Deshalb erzeugt der
      # Workflow einen PR mit dem neuen Chart, den jemand aus dem Team freigibt und mergt.
      - name: Pull Request mit neuem Burndown erstellen
        uses: peter-evans/create-pull-request@v7
        with:
          branch: burndown/update
          delete-branch: true
          add-paths: docs/burndown
          commit-message: Burndown aktualisiert
          committer: burndown-bot <burndown-bot@users.noreply.github.com>
          author: burndown-bot <burndown-bot@users.noreply.github.com>
          title: Burndown aktualisiert
          body: |
            Automatisch erzeugtes Burndown-Chart aus dem Board.
            Bitte kurz prüfen, freigeben und mergen.
