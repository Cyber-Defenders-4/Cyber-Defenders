<style> </style>

<main class="main">
  <div class="content">

    <div class="left-side">
    </div>

    <div class="divider" role="separator" aria-label="Divider"></div>

    <div class="right-side">
    </div>
    @if (assistant.visible()) {
      <cd-assistant [mood]="assistant.mood()"
                    [message]="assistant.message()"
                    [options]="assistant.options()"
      />
    }
  </div>
</main>

<div class="cd cd-scope cd-desktop cd-scanlines h-screen w-screen relative overflow-hidden p-space-5">

  <app-window 
    title="Nachrichten — 1 ungelesen" 
    width="450px"
    height="280px"
    left="150px"
    top="100px"
    [isActive]="true"
    [isStatic]="false">
    
    <app-panel [grow]="true">
      <p class="font-note text-[19px] m-0">
        Agent, im Serverraum blinkt alles rot. Jemand probiert seit Stunden Passwörter durch. 
        Schau dir das Log an, bevor der Kaffee kalt wird.
        <br>
        <span class="text-ink-muted text-[15px] font-ui mt-2 block">– Chief Ada</span>
      </p>
    </app-panel>

    <div class="flex gap-space-3 justify-end mt-space-2">

      <app-button>Ignorieren</app-button>
      
      <app-button [isDefault]="true">Akte öffnen</app-button>
      
    </div>

  </app-window>

</div>

<router-outlet />
